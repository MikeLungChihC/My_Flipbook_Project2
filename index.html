<!DOCTYPE html>
<html>
<head>
    <title>在坡道滑倒那天 全世界都背叛我 My Grandma</title>
    
    <meta property="og:title" content="在坡道滑倒那天 全世界都背叛我 My Grandma - 電子繪本">
    <meta property="og:description" content="這是一本關於從挫折中堅強站立的溫馨故事，適合國小高年級學生閱讀。">
    <meta property="og:type" content="book">
    <meta property="og:url" content="https://MikeLungChihC.github.io/My_Flipbook_Project2/">
    <meta property="og:image" content="https://MikeLungChihC.github.io/My_Flipbook_Project2/images/1.png">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="500">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    
    <link rel="stylesheet" href="lib/turn.css" />

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #f0f0f0; 
            display: flex;             
            justify-content: center;    
            align-items: center;        
        }

        #flipbook {
            transition: transform 0.5s ease-in-out;
        }

        #flipbook .page {
            background-color: white;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            position: relative; 
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            display: block;
            -webkit-user-drag: none;
            user-drag: none;
        }

        #flipbook .page:nth-child(even) { border-right: 1px solid #d0d0d0; }
        #flipbook .page:nth-child(odd) { border-left: 1px solid #d0d0d0; }

        #flipbook .page[page="1"], 
        #flipbook .page[page="28"] { 
            border: none !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3); 
        }

        .nav-button {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 60px;
            cursor: pointer;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            font-size: 30px;
            line-height: 60px;
            text-align: center;
            opacity: 0.8;
            transition: opacity 0.3s;
            outline: none;
            border-radius: 5px;
        }
        .nav-button:hover { opacity: 1; }
        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }

        #home-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            z-index: 101;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        #home-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(-3px);
        }

        /* 新增：反思紀錄按鈕 */
        #record-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            padding: 12px 24px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            z-index: 101;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        #record-btn:hover {
            background: #1c5980;
            transform: translateY(-3px);
        }

        .think-icon {
            position: absolute;
            bottom: 2%;  
            right: 7%;   
            background: #ffcc00;
            color: #333;
            padding: 6px 12px; 
            border-radius: 15px; 
            font-weight: bold;
            font-size: 13px; 
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 50; 
            animation: pulse 2s infinite; 
        }
        .think-icon:hover { transform: scale(1.1); background: #ffaa00; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(255, 204, 0, 0); } 
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none; 
            justify-content: center; align-items: center;
            z-index: 1000; 
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.show { display: flex; opacity: 1; }

        .modal-content {
            background: white; padding: 30px; border-radius: 15px;
            width: 80%; max-width: 450px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(-20px); transition: transform 0.3s ease;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-content h3 { margin-top: 0; color: #d35400; font-size: 24px; margin-bottom: 15px; }
        .modal-content p { font-size: 18px; line-height: 1.6; color: #333; margin-bottom: 15px; text-align: left;}
        
        /* 新增：文字輸入框與按鈕樣式 */
        textarea#user-answer {
            width: 100%;
            height: 100px;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
        }
        textarea#user-answer:focus {
            border-color: #f39c12;
            outline: none;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: background 0.3s;
        }
        #save-modal-btn { background: #e67e22; font-weight: bold;}
        #save-modal-btn:hover { background: #d35400; }
        #close-modal-btn, #close-record-btn { background: #95a5a6; }
        #close-modal-btn:hover, #close-record-btn:hover { background: #7f8c8d; }
        #print-btn { background: #27ae60; font-weight: bold;}
        #print-btn:hover { background: #2ecc71; }

        /* 新增：反思紀錄視窗樣式 */
        .record-content {
            max-width: 600px;
            width: 90%;
            text-align: left;
            max-height: 85vh;
            overflow-y: auto;
        }
        .record-item {
            background: #fdfdfd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 5px solid #f39c12;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .record-item h4 { margin: 0 0 10px 0; color: #2c3e50; font-size: 15px; line-height: 1.4; }
        .record-item p { margin: 0; color: #16a085; white-space: pre-wrap; font-size: 16px; font-weight: bold;}

        /* 新增：列印樣式 (點擊列印時只印出紀錄) */
        @media print {
            body * { visibility: hidden; }
            #record-modal, #record-modal * { visibility: visible; }
            #record-modal { position: absolute; left: 0; top: 0; width: 100%; background: white; }
            .modal-content { box-shadow: none; border: none; width: 100%; max-width: none; }
            .modal-buttons { display: none !important; }
        }

        @media (max-width: 600px) {
            #flipbook .page { border: none !important; }
            .nav-button { width: 30px; height: 50px; font-size: 20px; line-height: 50px; }
            #prev-btn { left: 5px; }
            #next-btn { right: 5px; }
            #home-btn { bottom: 10px; right: 10px; padding: 8px 15px; font-size: 14px; }
            #record-btn { bottom: 10px; left: 10px; padding: 8px 15px; font-size: 14px; }
            .think-icon { font-size: 11px; padding: 5px 8px; bottom: 2%; right: 2%; } 
            .modal-content { padding: 20px; width: 90%; }
        }
    </style>
</head>
<body>

        <div class="page"><img src="images/5.png" alt="第5頁" /></div>
        <div class="page"><img src="images/6.png" alt="第6頁" /></div>
        <div class="page"><img src="images/7.png" alt="第7頁" /></div>
        <div class="page"><img src="images/8.png" alt="第8頁" /></div>

        <div class="page"><img src="images/24.png" alt="第24頁" /></div>

    <!-- === 更新：題目與輸入視窗 === -->
    <div id="question-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">想一想 🤔</h3>
            <p id="modal-text">這裡會顯示問題內容</p>
            <textarea id="user-answer" placeholder="請在這裡打字，寫下你的真實感受..."></textarea>
            <div class="modal-buttons">
                <button id="save-modal-btn">💾 儲存並繼續閱讀</button>

    </div>

    <!-- === 新增：反思紀錄總覽視窗 === -->
    <div id="record-modal" class="modal-overlay">
        <div class="modal-content record-content">
            <h3 style="text-align: center; color: #2980b9;">📝 我的反思紀錄</h3>
            <div id="record-display">
                <!-- 這裡會由 JS 動態生成紀錄內容 -->
            </div>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button id="print-btn">🖨️ 列印 / 存成 PDF</button>
                <button id="close-record-btn">關閉</button>
            </div>
        </div>
    </div>

    <script src="lib/jquery.min.js"></script>
    <script src="lib/turn.js"></script>

    <script>
        $(document).ready(function() {
            
            var currentNarrative = null; 
            var currentQuestionId = null; 

            function isMobile() {
                return $(window).width() < 600;
            }

            var displayMode = isMobile() ? 'single' : 'double';

            function playAudioSequence(page, view) {
                if (currentNarrative) {
                    currentNarrative.pause();
                    currentNarrative.currentTime = 0;
                    currentNarrative.onended = null;
                    currentNarrative = null;
                }

                function playFile(pageNum, callback) {
                    if (!pageNum || pageNum < 4) { 
                        if (callback) callback();
                        return;
                    }

                    var audioPath = 'audio/' + pageNum + '.m4a';
                    var audioObj = new Audio(audioPath);
                    currentNarrative = audioObj;

                    var playPromise = audioObj.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function(error) {
                            if (callback) callback(); 
                        });
                    }

                    if (callback) {
                        audioObj.onended = function() {
                            callback();
                        };
                    }
                }

                if (isMobile()) {
                    playFile(page, null);
                } else {
                    var leftPage = view[0];
                    var rightPage = view[1];

                    playFile(leftPage, function() {
                        playFile(rightPage, null);
                    });
                }
            }

            var flipSound = document.getElementById("page-sound");

            var screenWidth = $(window).width();
            var screenHeight = $(window).height();
            var bookWidth, bookHeight;
            var maxPages = $('#flipbook').children().length; 

            if (isMobile()) {
                var targetRatio = 0.8;
                var availableWidth = screenWidth * 0.95;
                var availableHeight = screenHeight * 0.85;

                if (availableWidth / targetRatio <= availableHeight) {
                    bookWidth = availableWidth;
                    bookHeight = availableWidth / targetRatio;
                } else {
                    bookHeight = availableHeight;
                    bookWidth = availableHeight * targetRatio;
                }
            } else {
                var targetRatio = 1.6;
                var availableWidth = screenWidth * 0.85; 
                var availableHeight = screenHeight * 0.85; 

                if (availableWidth / targetRatio <= availableHeight) {
                    bookWidth = availableWidth;
                    bookHeight = availableWidth / targetRatio;
                } else {
                    bookHeight = availableHeight;
                    bookWidth = availableHeight * targetRatio;
                }
            }

            function adjustPosition(page) {
                if (isMobile()) {
                    $('#flipbook').css('transform', 'translateX(0px)');
                    return;
                }
                var shiftDistance = bookWidth / 4; 
                if (page === 1) {
                    $('#flipbook').css('transform', 'translateX(-' + shiftDistance + 'px)');
                } else if (page === maxPages) {
                    $('#flipbook').css('transform', 'translateX(' + shiftDistance + 'px)');
                } else {
                    $('#flipbook').css('transform', 'translateX(0px)');
                }
            }

            adjustPosition(1);

            $('#flipbook').turn({
                display: displayMode,
                autoCenter: false, 
                width: bookWidth,   
                height: bookHeight, 
                when: {
                    turning: function(event, page, view) {
                        adjustPosition(page);
                        
                        if (flipSound) {
                            flipSound.currentTime = 0;
                            flipSound.play().catch(function(e) {});
                        }
                        
                        playAudioSequence(page, view);
                    }
                }
            });


            $('#prev-btn').on('click touchend', function(e) { 
                e.preventDefault();
                $('#flipbook').turn('previous'); 
            });
            
            $('#next-btn').on('click touchend', function(e) { 
                e.preventDefault();
                $('#flipbook').turn('next'); 
            });
            
            $('#home-btn').on('click touchend', function(e) { 
                e.preventDefault();
                $('#flipbook').turn('page', 1); 
            });
            
            // 防止點擊圖示時觸發翻頁
            $(document).on('mousedown touchstart', '.think-icon', function(e) {
                e.stopPropagation(); 
            });

            // 開啟問題視窗並讀取之前的答案
            $(document).on('click touchend', '.think-icon', function(e) {
                e.preventDefault(); 
                e.stopPropagation(); 
                
                var questionText = $(this).attr('data-question'); 
                currentQuestionId = $(this).attr('data-id'); 
                
                $('#modal-text').text(questionText);
                
                // 讀取 localStorage 裡面存過的答案
                var savedAnswer = localStorage.getItem('flipbook_answer_' + currentQuestionId) || '';
                $('#user-answer').val(savedAnswer);
                         
                $('#question-modal').addClass('show');       
            });

            // 處理手機點擊 textarea 會被背景關閉或觸發翻頁的問題
            $('#user-answer').on('mousedown touchstart click touchend', function(e) {
                e.stopPropagation();
            });

            // 儲存答案
            $('#save-modal-btn').on('click touchend', function(e) {
                e.preventDefault();
                var answer = $('#user-answer').val().trim();
                
                if(currentQuestionId) {
                    localStorage.setItem('flipbook_answer_' + currentQuestionId, answer);
                    
                    // 視覺回饋
                    var originalText = $(this).text();
                    var originalBg = $(this).css('background-color');
                    $(this).text('✅ 儲存成功！');
                    $(this).css('background-color', '#27ae60');
                    
                    var btn = $(this);
                    setTimeout(function() {
                        btn.text(originalText);
                        btn.css('background-color', originalBg);
                        $('#question-modal').removeClass('show');
                    }, 800);
                }
            });

            $('#close-modal-btn').on('click touchend', function(e) {
                e.preventDefault();
                $('#question-modal').removeClass('show');
            });

            // 開啟「我的反思紀錄」總覽 (升級版：含時間戳記與隨機鼓勵)
            $('#record-btn').on('click touchend', function(e) {
                e.preventDefault();
                
                // 抓取三題的紀錄
                var rawQ1 = localStorage.getItem('flipbook_answer_q1') || '';
                var rawQ2 = localStorage.getItem('flipbook_answer_q2') || '';
                var rawQ3 = localStorage.getItem('flipbook_answer_q3') || '';
                
                // 判斷是否有寫內容 (只要有一題有寫字就算)
                var hasWritten = (rawQ1.trim() !== '' || rawQ2.trim() !== '' || rawQ3.trim() !== '');
                
                // 如果沒寫，顯示提示文字
                var q1 = rawQ1 ? rawQ1 : '（尚未填寫）';
                var q2 = rawQ2 ? rawQ2 : '（尚未填寫）';
                var q3 = rawQ3 ? rawQ3 : '（尚未填寫）';
                
                // 取得當前時間
                var now = new Date();
                var timeString = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + 
                                 String(now.getHours()).padStart(2, '0') + ':' + 
                                 String(now.getMinutes()).padStart(2, '0');
                
                // 準備隨機鼓勵語庫 (5種替換)
                var encouragements = [
                    "太棒了！你很認真地感受了自己的情緒，這一步非常不容易喔！🌟",
                    "寫下這些文字的你，展現了很棒的同理心與觀察力，繼續保持！👍",
                    "你的反思非常深刻，把心裡的想法化為文字，是給自己最好的禮物！🎁",
                    "好棒的紀錄！你願意花時間與自己對話，這份用心值得給一個大大的讚！✨",
                    "看到你這麼用心地寫下感受，相信稚諭和老奶奶都會為你感動的！💖"
                ];
                
                // 組合 HTML
                var html = '';
                
                // 加上時間戳記
                html += '<div style="text-align: right; color: #7f8c8d; font-size: 14px; margin-bottom: 15px; font-weight: bold;">紀錄時間：' + timeString + '</div>';
                
                html += '<div class="record-item"><h4>💡 問題 1：如果你是稚諭，來到一個聽不懂大家說話的新環境，你可能會有什麼感覺？為什麼會有這樣的感覺呢？</h4><p>' + q1 + '</p></div>';
                html += '<div class="record-item"><h4>💡 問題 2：明明是想幫忙，卻被大聲責備。如果你是稚諭，這時候你會有什麼感受？你會怎麼做，才能讓對方知道你的想法呢？</h4><p>' + q2 + '</p></div>';
                html += '<div class="record-item"><h4>💡 問題 3：聽到老奶奶主動道歉，如果你是稚諭，你願意留下來聽她說嗎？你會想對老奶奶說些什麼呢？</h4><p>' + q3 + '</p></div>';
                
                // 判斷並隨機加入鼓勵語
                if (hasWritten) {
                    var randomMsg = encouragements[Math.floor(Math.random() * encouragements.length)];
                    html += '<div style="margin-top: 20px; padding: 15px; background-color: #fff3e0; border: 2px dashed #f39c12; border-radius: 10px; color: #d35400; font-size: 16px; font-weight: bold; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">' + randomMsg + '</div>';
                }
                
                $('#record-display').html(html);
                $('#record-modal').addClass('show');
            });

            // 列印 / 轉存 PDF
            $('#print-btn').on('click touchend', function(e) {
                e.preventDefault();
                window.print(); 
            });

            $('#close-record-btn').on('click touchend', function(e) {
                e.preventDefault();
                $('#record-modal').removeClass('show');
            });

            // 點擊黑色背景關閉視窗 (包含兩個視窗)
            $('.modal-overlay').on('click touchend', function(e) {
                if (e.target === this) {
                    e.preventDefault();
                    $(this).removeClass('show');
                }
            });

            $('#flipbook').bind('click', function(e){
                if ($(e.target).closest('.think-icon').length > 0) {
                    return;
                }
                
                var offset = $(this).offset();
                if (e.clientX < offset.left + $(this).width() / 2) {
                    $('#flipbook').turn('previous');
                } else {
                    $('#flipbook').turn('next');
                }
            });

            $(window).resize(function() {
                clearTimeout(window.resizedFinished);
                window.resizedFinished = setTimeout(function(){
                    location.reload();
                }, 250);
            });
        });
    </script>

</body>
</html>
