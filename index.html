<!DOCTYPE html>
<html>
<head>
    <title>在坡道滑倒那天 全世界都背叛我 My Grandma</title>
    
    <meta property="og:title" content="在坡道滑倒那天 全世界都背叛我 My Grandma - 電子繪本">
    <meta property="og:description" content="這是一本關於從挫折中堅強站立的溫馨故事，適合國小高年級學生閱讀。">
    <meta property="og:type" content="book">
    <meta property="og:url" content="https://MikeLungChihC.github.io/My_Flipbook_Project2/">
    <meta property="og:image" content="https://MikeLungChihC.github.io/My_Flipbook_Project2/images/1.png">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="500">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    
    <link rel="stylesheet" href="lib/turn.css" />

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #f0f0f0; 
            display: flex;             
            justify-content: center;    
            align-items: center;        
        }

        #flipbook {
            transition: transform 0.5s ease-in-out;
        }

        #flipbook .page {
            background-color: white;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            position: relative; 
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            display: block;
            -webkit-user-drag: none;
            user-drag: none;
        }

        #flipbook .page:nth-child(even) { border-right: 1px solid #d0d0d0; }
        #flipbook .page:nth-child(odd) { border-left: 1px solid #d0d0d0; }

        #flipbook .page[page="1"], 
        #flipbook .page[page="28"] { 
            border: none !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3); 
        }

        .nav-button {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 60px;
            cursor: pointer;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            font-size: 30px;
            line-height: 60px;
            text-align: center;
            opacity: 0.8;
            transition: opacity 0.3s;
            outline: none;
            border-radius: 5px;
        }
        .nav-button:hover { opacity: 1; }
        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }

        #home-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            z-index: 101;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        #home-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(-3px);
        }

        .think-icon {
            position: absolute;
            bottom: 2%;  
            right: 7%;   
            background: #ffcc00;
            color: #333;
            padding: 6px 12px; 
            border-radius: 15px; 
            font-weight: bold;
            font-size: 13px; 
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 50; 
            animation: pulse 2s infinite; 
        }
        .think-icon:hover { transform: scale(1.1); background: #ffaa00; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(255, 204, 0, 0); } 
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none; 
            justify-content: center; align-items: center;
            z-index: 1000; 
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.show { display: flex; opacity: 1; }

        .modal-content {
            background: white; padding: 30px; border-radius: 15px;
            width: 80%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(-20px); transition: transform 0.3s ease;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-content h3 { margin-top: 0; color: #d35400; font-size: 24px; margin-bottom: 15px; }
        .modal-content p { font-size: 18px; line-height: 1.6; color: #333; margin-bottom: 25px; }
        #close-modal-btn {
            background: #4CAF50; color: white; border: none;
            padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer;
        }
        #close-modal-btn:hover { background: #45a049; }

        @media (max-width: 600px) {
            #flipbook .page { border: none !important; }
            .nav-button { width: 30px; height: 50px; font-size: 20px; line-height: 50px; }
            #prev-btn { left: 5px; }
            #next-btn { right: 5px; }
            #home-btn { bottom: 10px; right: 10px; padding: 8px 15px; font-size: 14px; }
            .think-icon { font-size: 11px; padding: 5px 8px; bottom: 2%; right: 2%; } 
        }
    </style>
</head>
<body>

    <button id="prev-btn" class="nav-button"> &lt; </button>
    <button id="next-btn" class="nav-button"> &gt; </button>
    <button id="home-btn">回到封面</button>

    <audio id="page-sound">
        <source src="page-flip.mp3" type="audio/mpeg">
    </audio>

    <div id="flipbook">
        <div class="page"><img src="images/1.png" alt="封面" /></div>
        <div class="page"><img src="images/2.png" alt="第2頁" /></div>
        <div class="page"><img src="images/3.png" alt="第3頁" /></div>
        <div class="page"><img src="images/4.png" alt="第4頁" /></div>
        <div class="page"><img src="images/5.png" alt="第5頁" /></div>
        <div class="page"><img src="images/6.png" alt="第6頁" /></div>
        <div class="page"><img src="images/7.png" alt="第7頁" /></div>
        <div class="page"><img src="images/8.png" alt="第8頁" /></div>
        <div class="page"><img src="images/9.png" alt="第9頁" /></div>
        <div class="page"><img src="images/10.png" alt="第10頁" /></div>
        <div class="page"><img src="images/11.png" alt="第11頁" /></div>
        <div class="page"><img src="images/12.png" alt="第12頁" /></div>        
        <div class="page"><img src="images/13.png" alt="第13頁" /></div>
        <div class="page">
            <img src="images/14.png" alt="第14頁" />
            <div class="think-icon" data-question="如果你是稚諭，來到一個聽不懂大家說話的新環境，心裡可能會有什麼感覺呢？">💡 想一想</div>
        </div>

        <div class="page"><img src="images/15.png" alt="第15頁" /></div>
        <div class="page"><img src="images/16.png" alt="第16頁" /></div>
        <div class="page"><img src="images/17.png" alt="第17頁" /></div>
        <div class="page"><img src="images/18.png" alt="第18頁" /></div>
        <div class="page"><img src="images/19.png" alt="第19頁" /></div>        
        <div class="page"><img src="images/20.png" alt="第20頁" /></div>
        <div class="page">
            <img src="images/21.png" alt="第21頁" />
            <div class="think-icon" data-question="明明是想幫忙卻被大聲責備，如果你是稚諭，這時候你會怎麼想？又會怎麼做呢？">💡 想一想</div>
        </div>        
        <div class="page"><img src="images/22.png" alt="第22頁" /></div>
        <div class="page">
            <img src="images/23.png" alt="第23頁" />
            <div class="think-icon" data-question="聽到老奶奶主動道歉，稚諭沒有轉身逃走。換作是你，你會選擇原諒老奶奶嗎？為什麼？">💡 想一想</div>
        </div>

        <div class="page"><img src="images/24.png" alt="第24頁" /></div>
        <div class="page"><img src="images/25.png" alt="第25頁" /></div>
        <div class="page"><img src="images/26.png" alt="第26頁" /></div>
        <div class="page"><img src="images/27.png" alt="第27頁" /></div>
        <div class="page"><img src="images/28.png" alt="封底" /></div>
    </div>

    <!-- === 彈出視窗結構 === -->
    <div id="question-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">想一想 🤔</h3>
            <p id="modal-text">這裡會顯示問題內容</p>
            <button id="close-modal-btn">關閉並繼續閱讀</button>
        </div>
    </div>

    <script src="lib/jquery.min.js"></script>
    <script src="lib/turn.js"></script>

    <script>
        $(document).ready(function() {
            
            var currentNarrative = null; 

            function isMobile() {
                return $(window).width() < 600;
            }

            var displayMode = isMobile() ? 'single' : 'double';

            function playAudioSequence(page, view) {
                if (currentNarrative) {
                    currentNarrative.pause();
                    currentNarrative.currentTime = 0;
                    currentNarrative.onended = null;
                    currentNarrative = null;
                }

                function playFile(pageNum, callback) {
                    if (!pageNum || pageNum < 4) { 
                        if (callback) callback();
                        return;
                    }

                    var audioPath = 'audio/' + pageNum + '.m4a';
                    var audioObj = new Audio(audioPath);
                    currentNarrative = audioObj;

                    var playPromise = audioObj.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function(error) {
                            if (callback) callback(); 
                        });
                    }

                    if (callback) {
                        audioObj.onended = function() {
                            callback();
                        };
                    }
                }

                if (isMobile()) {
                    playFile(page, null);
                } else {
                    var leftPage = view[0];
                    var rightPage = view[1];

                    playFile(leftPage, function() {
                        playFile(rightPage, null);
                    });
                }
            }

            var flipSound = document.getElementById("page-sound");

            var screenWidth = $(window).width();
            var screenHeight = $(window).height();
            var bookWidth, bookHeight;
            var maxPages = $('#flipbook').children().length; 

            if (isMobile()) {
                var targetRatio = 0.8;
                var availableWidth = screenWidth * 0.95;
                var availableHeight = screenHeight * 0.85;

                if (availableWidth / targetRatio <= availableHeight) {
                    bookWidth = availableWidth;
                    bookHeight = availableWidth / targetRatio;
                } else {
                    bookHeight = availableHeight;
                    bookWidth = availableHeight * targetRatio;
                }
            } else {
                var targetRatio = 1.6;
                var availableWidth = screenWidth * 0.85; 
                var availableHeight = screenHeight * 0.85; 

                if (availableWidth / targetRatio <= availableHeight) {
                    bookWidth = availableWidth;
                    bookHeight = availableWidth / targetRatio;
                } else {
                    bookHeight = availableHeight;
                    bookWidth = availableHeight * targetRatio;
                }
            }


            function adjustPosition(page) {
                if (isMobile()) {
                    $('#flipbook').css('transform', 'translateX(0px)');
                    return;
                }
                // 
                var shiftDistance = bookWidth / 4; 
                if (page === 1) {
                    $('#flipbook').css('transform', 'translateX(-' + shiftDistance + 'px)');
                } else if (page === maxPages) {
                    $('#flipbook').css('transform', 'translateX(' + shiftDistance + 'px)');
                } else {
                    $('#flipbook').css('transform', 'translateX(0px)');
                }
            }

            adjustPosition(1);

            $('#flipbook').turn({
                display: displayMode,
                autoCenter: false, 
                width: bookWidth,   
                height: bookHeight, 
                when: {
                    turning: function(event, page, view) {
                        adjustPosition(page);
                        
                        if (flipSound) {
                            flipSound.currentTime = 0;
                            flipSound.play().catch(function(e) {});
                        }
                        
                        playAudioSequence(page, view);
                    }
                }
            });

            $('#prev-btn').click(function() { $('#flipbook').turn('previous'); });
            $('#next-btn').click(function() { $('#flipbook').turn('next'); });
            
            $('#home-btn').click(function() { 
                $('#flipbook').turn('page', 1); 
            });
            
            // 
            $(document).on('mousedown touchstart', '.think-icon', function(e) {
                e.stopPropagation(); 
            });

            $(document).on('click', '.think-icon', function(e) {
                e.stopPropagation(); 
                var questionText = $(this).attr('data-question'); 
                $('#modal-text').text(questionText);         
                $('#question-modal').addClass('show');       
            });

            $('#close-modal-btn').click(function() {
                $('#question-modal').removeClass('show');
            });

            $('#question-modal').click(function(e) {
                if (e.target === this) {
                    $(this).removeClass('show');
                }
            });

            $('#flipbook').bind('click', function(e){
                if ($(e.target).closest('.think-icon').length > 0) {
                    return;
                }
                
                var offset = $(this).offset();
                if (e.clientX < offset.left + $(this).width() / 2) {
                    $('#flipbook').turn('previous');
                } else {
                    $('#flipbook').turn('next');
                }
            });

            // 
            $(window).resize(function() {
                clearTimeout(window.resizedFinished);
                window.resizedFinished = setTimeout(function(){
                    location.reload();
                }, 250);
            });
        });
    </script>

</body>
</html>
